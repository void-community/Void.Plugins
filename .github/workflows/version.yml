on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
      release-please:
        type: boolean
        required: false
        default: true
    outputs:
      dotnet-version:
        description: "Generated .NET Version"
        value: ${{ jobs.dev.outputs.dotnet-version }}
      release-info:
        description: "Release Please Output"
        value: ${{ jobs.release-please.outputs.info || '{}' }}

env:
  DOTNET_VERSION: ${{ github.event.inputs.dotnet_version || join(fromJSON('["9.0.x","10.0.x"]'), '\n') }}

jobs:
  dev:
    runs-on: ubuntu-latest
    outputs:
      dotnet-version: ${{ steps.dotnet-version.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set .NET SDK version
        id: dotnet-version
        run: printf 'result<<EOF\n%b\nEOF\n' "$DOTNET_VERSION" >> "$GITHUB_OUTPUT"

  release-please:
    if: ${{ inputs.release-please }}
    runs-on: ubuntu-latest
    outputs:
      info: ${{ toJSON(steps.release.outputs) }}
    steps:
      # Pull requests and commits made with GITHUB_TOKEN wait for approval before their checks run,
      # so release pull requests couldn't pass the required checks
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Create Release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/RELEASE_PLEASE/config.json
          manifest-file: .github/RELEASE_PLEASE/manifest.json

      - name: Print Release Info
        continue-on-error: true
        run: echo "${{ toJSON(steps.release.outputs) }}"
