on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: true
      release-info:
        type: string
        required: true

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read plugin manifest
        id: read
        run: |
          set -euo pipefail
          jq -e '.plugins | length > 0' .github/plugin-manifest.json > /dev/null
          dup=$(jq -r '.plugins[].slug' .github/plugin-manifest.json | sort | uniq -d)
          if [ -n "$dup" ]; then echo "::error::duplicate slug(s): $dup"; exit 1; fi
          echo "matrix=$(jq -c '.plugins' .github/plugin-manifest.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: set-matrix
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMIT_MESSAGE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: 'src/**/*.csproj'

      - name: Build ${{ matrix.component }} without Version
        if: ${{ fromJSON(inputs.release-info).releases_created != 'true' && fromJSON(inputs.release-info)[format('{0}--release_created', matrix.path)] != 'true' }}
        run: dotnet build ${{ matrix.path }} --configuration Release

      - name: Build ${{ matrix.component }}
        if: ${{ fromJSON(inputs.release-info)[format('{0}--release_created', matrix.path)] == 'true' }}
        run: dotnet build ${{ matrix.path }} --configuration Release /p:Version=${{ fromJSON(inputs.release-info)[format('{0}--version', matrix.path)] }}

      - name: Publish ${{ matrix.component }}
        if: ${{ fromJSON(inputs.release-info)[format('{0}--release_created', matrix.path)] == 'true' }}
        run: dotnet publish ${{ matrix.path }} --output artifacts --configuration Release --no-build /p:DebugType=embedded /p:Version=${{ fromJSON(inputs.release-info)[format('{0}--version', matrix.path)] }}

      - name: Rename ${{ matrix.component }} Artifact
        if: ${{ fromJSON(inputs.release-info)[format('{0}--release_created', matrix.path)] == 'true' }}
        shell: bash
        run: mv artifacts/Void.Plugins.${{ matrix.component }}.dll artifacts/${{ matrix.slug }}.dll

      - name: Upload ${{ matrix.component }} Build Artifact
        if: ${{ fromJSON(inputs.release-info)[format('{0}--release_created', matrix.path)] == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}.dll
          path: artifacts/${{ matrix.slug }}.dll
          compression-level: 9
          if-no-files-found: error
