on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: true
      release-info:
        type: string
        required: true

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read plugin manifest
        id: read
        run: |
          set -euo pipefail
          jq -e '.plugins | length > 0' .github/plugin-manifest.json > /dev/null
          dup=$(jq -r '.plugins[].slug' .github/plugin-manifest.json | sort | uniq -d)
          if [ -n "$dup" ]; then echo "::error::duplicate slug(s): $dup"; exit 1; fi
          echo "matrix=$(jq -c '.plugins' .github/plugin-manifest.json)" >> "$GITHUB_OUTPUT"

  push:
    needs: set-matrix
    # nuget.org trusted publishing exchanges the job's OIDC token for a short-lived API key.
    # Its policy must name this file (nuget.yml): it checks the job_workflow_ref claim, which names the reusable workflow.
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: ${{ fromJSON(inputs.release-info).releases_created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: 'src/**/*.csproj'

      - name: Build ${{ matrix.component }}
        if: ${{ fromJSON(inputs.release-info)[format('{0}--release_created', matrix.path)] == 'true' }}
        run: dotnet build ${{ matrix.path }} --configuration Release /p:Version=${{ fromJSON(inputs.release-info)[format('{0}--version', matrix.path)] }}

      - name: Pack ${{ matrix.component }}
        if: ${{ fromJSON(inputs.release-info)[format('{0}--release_created', matrix.path)] == 'true' }}
        run: dotnet pack ${{ matrix.path }} --configuration Release --output artifacts /p:Version=${{ fromJSON(inputs.release-info)[format('{0}--version', matrix.path)] }}

      - name: Rename ${{ matrix.component }} Artifacts
        if: ${{ fromJSON(inputs.release-info)[format('{0}--release_created', matrix.path)] == 'true' }}
        shell: bash
        run: mv artifacts/Void.Plugins.${{ matrix.component }}.${{ fromJSON(inputs.release-info)[format('{0}--version', matrix.path)] }}.nupkg artifacts/${{ matrix.slug }}.nupkg

      # The temporary API key is valid for an hour, so it is requested right before pushing
      - name: NuGet Login
        id: login
        if: ${{ fromJSON(inputs.release-info)[format('{0}--release_created', matrix.path)] == 'true' }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet Push ${{ matrix.component }}
        if: ${{ fromJSON(inputs.release-info)[format('{0}--release_created', matrix.path)] == 'true' }}
        run: dotnet nuget push artifacts/${{ matrix.slug }}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: Upload ${{ matrix.component }} Build Artifact
        if: ${{ fromJSON(inputs.release-info)[format('{0}--release_created', matrix.path)] == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}.nupkg
          path: artifacts/${{ matrix.slug }}.nupkg
          compression-level: 9
          if-no-files-found: error
